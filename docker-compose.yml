services:
  # Contêiner da Aplicação Web / API (FrankenPHP)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobeb_api
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - REVERB_HOST=reverb
      - SERVER_NAME=:80
    networks:
      - coolify

  # Contêiner do WebSockets (Laravel Reverb)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobeb_reverb
    restart: unless-stopped
    command: php artisan reverb:start --host="0.0.0.0" --port=8080
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=production
    depends_on:
      - api
    networks:
      - coolify

  # Contêiner de Processamento de Filas (Laravel Queue)
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobeb_queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90
    environment:
      - APP_ENV=production
    depends_on:
      - api
    networks:
      - coolify

# Conecta todos os serviços à rede global do Coolify
networks:
  coolify:
    external: true
